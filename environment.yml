name: autolabel
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - git
  - pip:
      - "--extra-index-url https://download.pytorch.org/whl/cu124"
      - "torch==2.6.0+cu124; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')"
      - "torchvision==0.21.0+cu124; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')"
      - "-e .[test,multimodal,workbench,yolo-world]"
