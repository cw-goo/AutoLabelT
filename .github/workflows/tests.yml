name: Tests and wheel

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - run: python -m pip install -e ".[test]" wheel
      - run: python -m pytest -q tests
      - run: python tools/check_release.py
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, 'tools/check_distribution.py', glob.glob('dist/*.whl')[0]])"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
