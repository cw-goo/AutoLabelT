name: Tests and wheel

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - run: python -m pip install -e ".[test]" wheel
      - run: python -m pip check
      - run: python -m pytest -q tests
      - run: python tools/check_release.py
      - run: python tools/build_distribution.py --output-dir dist --sdist
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
