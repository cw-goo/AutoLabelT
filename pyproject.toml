[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabel"
version = "0.1.0"
description = "AutoLabel video and image annotation workbench"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyQt6>=6.6,<6.10",
    "opencv-contrib-python-headless>=4.8",
    "Pillow>=10",
    "numpy>=1.24",
    "ultralytics>=8.3",
    "PyYAML>=6",
    "termcolor>=2",
    "natsort>=8",
    "qimage2ndarray>=1.10",
    "requests>=2.31",
    "packaging>=23",
    "Markdown>=3.5",
    "jsonlines>=4",
    "json-repair>=0.30",
    "openai>=1",
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=8"]
multimodal = ["transformers>=4.56,<5", "einops>=0.8", "timm>=1.0"]
yolo-world = [
    "ftfy>=6.1",
    "regex>=2023.0",
    "clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40",
]

[project.scripts]
autolabel = "autolabel.desktop:main"

[tool.setuptools.packages.find]
include = ["autolabel*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.json", "*.yaml", "*.yml", "*.gz", "*.h", "*.cuh", "*.cpp", "*.cu"]
autolabel = ["assets/*.svg"]
"autolabel.workbench" = ["configs/*.yaml", "configs/auto_labeling/*.yaml", "resources/*.rcc", "resources/images/*", "resources/translations/*", "**/*.ui", "services/auto_labeling/osam/clip/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "artifacts/pytest_cache"
